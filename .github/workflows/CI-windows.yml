name: CI-windows

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        run: .\build\bin\Debug\testrunner.exe
